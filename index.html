  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

circle>\n        <circle cx=\"98\" cy=\"88\" r=\"4.2\" fill=\"#22252b\"></circle>\n        <circle cx=\"83.6\" cy=\"86.4\" r=\"1.2\" fill=\"#ffffff\"></circle>\n        <circle cx=\"99.6\" cy=\"86.4\" r=\"1.2\" fill=\"#ffffff\"></circle>\n        <path d=\"M85 99.5 Q90 103.5 95 99.5\" stroke=\"#22252b\" stroke-width=\"1.4\" stroke-linecap=\"round\" fill=\"none\"></path>\n      </svg>\n    </div>\n  </div>\n    <span style=\"position:absolute;top:calc(100% - 6px);left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.42em;text-transform:uppercase;color:#9aa1ac;white-space:nowrap\">Тиша · натисни</span>\n\n    <!-- Tisha panel -->\n  <div id=\"tishaModal\" style=\"display:none;position:fixed;inset:0;background:rgba(3,3,4,.7);backdrop-filter:blur(10px);z-index:100;align-items:center;justify-content:center;padding:20px\">\n    <div style=\"background:linear-gradient(180deg,#101114,#08090a);border:1px solid rgba(226,230,235,.18);border-radius:28px;padding:38px 32px;max-width:460px;width:100%;position:relative;max-height:88vh;overflow:auto\">\n      <button id=\"tishaClose\" style=\"position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid rgba(226,230,235,.25);background:rgba(226,230,235,.05);color:#e6e8ec;font-size:15px;cursor:pointer\">✕</button>\n      <div style=\"font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#848b96;margin-bottom:14px\">Твой проводник в тишину</div>\n      <div style=\"font-family:'Cormorant Garamond',serif;font-weight:500;text-transform:uppercase;font-size:28px;letter-spacing:.06em;margin-bottom:18px;background:linear-gradient(176deg,#f2f4f7,#8f97a3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">Знакомьтесь, Тиша</div>\n      <p style=\"font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:300;line-height:1.8;color:#ccd1d8;margin-bottom:14px\">Тиша — твой личный проводник. Он рядом каждый день, слышит и текст, и голос, помнит тебя и твою историю.</p>\n      <p style=\"font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:300;line-height:1.8;color:#ccd1d8;margin-bottom:22px\">Он ведёт тебя через твою жизнь к состоянию тишины. К радости просто от того, что ты есть. К целостности внутри. К любви к себе.</p>\n      <div style=\"font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#848b96;margin-bottom:12px\">Что внутри</div>\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:22px\">\n        <div style=\"display:flex;gap:11px;align-items:flex-start;border:1px solid rgba(226,230,235,.1);border-radius:16px;padding:11px 15px;font-family:'Manrope',sans-serif;font-size:12.5px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:6px\"></span><span>Разобрать ситуацию. Вместе дойдете до сути, и Тиша даст практику Юры именно под тебя</span></div>\n        <div style=\"display:flex;gap:11px;align-items:flex-start;border:1px solid rgba(226,230,235,.1);border-radius:16px;padding:11px 15px;font-family:'Manrope',sans-serif;font-size:12.5px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:6px\"></span><span>Подышать. Короткая дыхательная практика прямо в чате, когда тебе это нужно</span></div>\n        <div style=\"display:flex;gap:11px;align-items:flex-start;border:1px solid rgba(226,230,235,.1);border-radius:16px;padding:11px 15px;font-family:'Manrope',sans-serif;font-size:12.5px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:6px\"></span><span>Фокус дня. Три осознанных фокуса, с которыми ты идёшь в свой день</span></div>\n      </div>\n      <p style=\"font-family:'Manrope',sans-serif;font-size:13px;font-weight:300;line-height:1.75;color:#9aa1ac;margin-bottom:20px\">Тиша — проводник. За твоим состоянием мягко смотрит живая команда заботы.</p>\n      <a href=\"#oplata\" id=\"tishaCta\" style=\"display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(226,230,235,.35);border-radius:999px;padding:13px 26px;font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f4f6f8;font-weight:500;text-decoration:none\"><span style=\"width:5px;height:5px;background:currentColor;border-radius:50%\"></span>Записаться на церемонию</a>\n    </div>\n  </div>\n<!-- ================= HERO ================= -->\n  <header style=\"position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 24px 90px\">\n    <div style=\"font-size:10px;letter-spacing:.5em;color:#9aa1ac;text-transform:uppercase;margin-bottom:30px;opacity:0;animation:fadein 2s ease .3s forwards\">Онлайн-практика · 1,5 часа</div>\n    <h1 style=\"margin:0;opacity:0;animation:rise 1.8s cubic-bezier(.2,.7,.2,1) .2s forwards\">\n      <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-weight:500;text-transform:uppercase;line-height:1.02;font-size:clamp(42px,9vw,110px);letter-spacing:.12em;background:linear-gradient(176deg,#f6f8fa 0%,#c9ced6 32%,#8f97a3 63%,#5d646e 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">Церемония<br>Тишины</span>\n    </h1>\n    <div style=\"max-width:520px;margin:38px auto 0;opacity:0;animation:rise 1.8s cubic-bezier(.2,.7,.2,1) .6s forwards\">\n      <div style=\"font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#9aa1ac;margin-bottom:18px\">За 1,5 часа ты</div>\n      <div style=\"display:flex;flex-direction:column;gap:12px;text-align:left\">\n        <div style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:9px\"></span><span>выйдешь из шума и впервые за долгое время останешься в тишине внутри;</span></div>\n        <div style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:9px\"></span><span>услышишь свой настоящий голос, без масок и чужих ролей;</span></div>\n        <div style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:9px\"></span><span>встретишься со своей душой и услышишь, чего она хочет;</span></div>\n        <div style=\"display:flex;gap:12px;font-size:15px;line-height:1.6;color:#ccd1d8\"><span style=\"flex:none;width:5px;height:5px;border-radius:50%;background:#e3e6ea;box-shadow:0 0 8px rgba(226,230,235,.7);margin-top:9px\"></span><span>поймёшь, как двигаться дальше из своих настоящих желаний, без стресса, из тишины.</span></div>\n      </div>\n    </div>\n    <div class=\"offer-slot\" style=\"width:min(92vw,520px);margin:40px auto 0;opacity:0;animation:rise 1.8s cubic-bezier(.2,.7,.2,1) .9s forwards\"></div>\n  </header>\n\n  <!-- ================= YURA INTRO ================= -->\n  <section style=\"position:relative;z-index:3;padding:clamp(70px,10vh,110px) 24px 30px;text-align:center\">\n    <div class=\"reveal\" style=\"max-width:380px;margin:0 auto\">\n      <div style=\"border-radius:200px 200px 26px 26px;overflow:hidden;border:1px solid rgba(226,230,235,.14);-webkit-mask-image:linear-gradient(180deg,#000 78%,transparent);mask-image:linear-gradient(180deg,#000 78%,transparent)\">\n        <img src=\"b72e1e33-27b2-44d7-bd5f-bbd5cf73472c\" alt=\"Юрий Кручин\" style=\"width:100%;display:block;filter:saturate(.55) contrast(1.04)\">\n      </div>\n      <div style=\"margin-top:-8px;font-family:'Cormorant Garamond',serif;font-weight:500;text-transform:uppercase;font-size:clamp(26px,4vw,38px);letter-spacing:.14em;background:linear-gradient(176deg,#f2f4f7,#8f97a3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">Юрий Кручин</div>\n      <div style=\"display:inline-block;margin-top:14px;padding:9px 24px;border:1px solid rgba(226,230,235,.22);border-radius:999px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#b9bfc9\">проводник · инвестор · 20 лет пути</div>\n    </div>\n  </section>\n\n  <!-- ================= ДЛЯ ТЕБЯ ЕСЛИ ================= -->\n  <section style=\"position:relative;z-index:3;padding:clamp(80px,12vh,140px) clamp(22px,5vw,60px)\">\n    <div class=\"reveal\" style=\"max-width:820px;margin:0 auto\">\n      <div style=\"font-size:10px;letter-spacing:.46em;text-transform:uppercase;color:#848b96;text-align:center;margin-bottom:22px\">Для кого эта церемония</div>\n      <h2 style=\"text-align:center;font-family:'Cormorant Garamond',serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,4.6vw,52px);letter-spacing:.08em;margin:0 0 44px;background:linear-gradient(176deg,#f2f4f7,#8f97a3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">Это для тебя, если</h2>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">01</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">то, что раньше вдохновляло и радовало, теперь идёт на автомате и истощает</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">02</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты прошёл десятки практик и курсов, но в жизни всё повторяется по тому же сценарию</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">03</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты живёшь из ума, и в голове постоянный шум, который не выключить</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">04</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты носишь маски и больше не помнишь, кто ты без них</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">05</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты устал подстраиваться и спасать всех, и сам уже не понимаешь, чего хочешь</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">06</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты хочешь начать реализовывать желания души, потому что очередные цели из головы уже не вдохновляют</span></div>\n        <div style=\"display:flex;gap:22px;align-items:center;background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:18px;padding:20px 26px\"><span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;min-width:32px\">07</span><span style=\"font-size:15px;line-height:1.55;color:#ccd1d8\">ты ищешь следующий уровень глубины, потому что внутри есть ощущение, что можешь больше</span></div>\n      </div>\n      <div class=\"offer-slot\" style=\"width:min(92vw,520px);margin:44px auto 0\"></div>\n    </div>\n  </section>\n\n  <!-- ================= ЧТО ВНУТРИ ================= -->\n  <section style=\"position:relative;z-index:3;padding:clamp(80px,12vh,140px) clamp(22px,5vw,60px);background:radial-gradient(120% 80% at 50% 0%,rgba(14,15,18,.85),transparent 70%)\">\n    <div class=\"reveal\" style=\"max-width:900px;margin:0 auto\">\n      <div style=\"font-size:10px;letter-spacing:.46em;text-transform:uppercase;color:#848b96;text-align:center;margin-bottom:22px\">Что ты проживёшь</div>\n      <h2 style=\"text-align:center;font-family:'Cormorant Garamond',serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,4.6vw,52px);letter-spacing:.08em;margin:0 0 24px;background:linear-gradient(176deg,#f2f4f7,#8f97a3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent\">1,5 часа живой практики</h2>\n      <p style=\"text-align:center;font-size:15.5px;color:#b9bfc9;max-width:640px;margin:0 auto 44px;line-height:1.75\">Это запись настоящего живого эфира, где вместе со мной дышали 70 человек. Ты заходишь в это поле и проживаешь церемонию своим телом, дома, в своём пространстве.</p>\n      <div class=\"grid2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n        <div style=\"background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:20px;padding:28px 26px\"><div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;margin-bottom:10px\">01</div><h4 style=\"color:#f1f3f6;font-size:17px;font-weight:500;margin-bottom:8px\">Дыхание с задержками</h4><p style=\"color:#9aa1ac;font-size:14px;line-height:1.65\">Дыхательная практика, после которой внутри становится тихо, и в этой тишине ты слышишь сам себя.</p></div>\n        <div style=\"background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:20px;padding:28px 26px\"><div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;margin-bottom:10px\">02</div><h4 style=\"color:#f1f3f6;font-size:17px;font-weight:500;margin-bottom:8px\">Микрокосмическая орбита</h4><p style=\"color:#9aa1ac;font-size:14px;line-height:1.65\">Вниманием поднимаем энергию по телу, связь с сердцем и с макушкой, возвращение в присутствие.</p></div>\n        <div style=\"background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:20px;padding:28px 26px\"><div style=\"font-family:'Cormorant Garamond',serif;font-style:italic;color:#9aa1ac;font-size:22px;margin-bottom:10px\">03</div><h4 style=\"color:#f1f3f6;font-size:17px;font-weight:500;margin-bottom:8px\">Встреча с душой и родом</h4><p style=\"color:#9aa1ac;font-size:14px;line-height:1.65\">Тихий разговор со своей душой и работа с родовой системой, прощение и благодарность.</p></div>\n        <div style=\"background:rgba(13,14,17,.66);backdrop-filter:blur(8px);border:1px solid rgba(226,230,235,.1);border-radius:20px;padding:28px 26px\"><div циальности и реквизиты ФОП/компании.]</p>\n      </div>\n      <div id=\"legal-offer\" style=\"display:none\">\n        <h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;color:#f1f3f6;margin-bottom:16px\">Договор публичной оферты</h2>\n        <p style=\"color:#9aa1ac;font-size:14px;line-height:1.75\">[Вставить текст договора публичной оферты и реквизиты.]</p>\n      </div>\n    </div>\n  </div>\n\n  \n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals(){ return {}; }\n\n  componentDidMount(){\n    const root = this.el || document;\n    const $ = (s)=>root.querySelector(s);\n    const $$ = (s)=>Array.from(root.querySelectorAll(s));\n\n    // повторяемый оффер-блок (цена + CTA + таймер)\n    const offerHTML = (note)=>\n      `<div style=\"background:rgba(13,14,17,.72);backdrop-filter:blur(10px);border:1px solid rgba(226,230,235,.18);border-radius:26px;padding:26px 26px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center\">`+\n      `<div style=\"display:inline-flex;align-items:baseline;gap:12px;color:#eceff3;font-size:14px\"><span style=\"color:#848b96;text-decoration:line-through;font-size:19px\">€9</span><b style=\"font-size:30px;color:#f4f6f8;font-weight:600\">€0.99</b><span style=\"color:#9aa1ac\">меньше свечки в храме</span></div>`+\n      `<button class=\"cta-btn\" style=\"width:100%;display:inline-flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#f4f6f8,#c9ced6);color:#0a0b0d;padding:19px 34px;border:none;border-radius:999px;font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:0 12px 30px rgba(226,230,235,.12);transition:.35s\">Пройти церемонию <span style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#0a0b0d;color:#e3e6ea;font-size:14px\">→</span></button>`+\n      `<div style=\"color:#848b96;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">импульс это уже язык твоей души, не откладывай<div class=\"timer\" style=\"font-size:26px;font-weight:600;letter-spacing:.1em;color:#f1f3f6;margin-top:6px\">15 : 00</div></div>`+\n      (note?`<div style=\"color:#848b96;font-size:12.5px\">${note}</div>`:``);\n\n    $$(\".offer-slot\").forEach(slot=>{ slot.innerHTML = offerHTML(slot.dataset.note||\"\"); });\n    // в hero-оффер добавляем «что получишь после оплаты»\n    const heroSlot = $$(\".offer-slot\")[0];\n    if(heroSlot){\n      const card = heroSlot.firstElementChild;\n      card.insertAdjacentHTML(\"beforeend\",\n        `<div style=\"border-top:1px solid rgba(226,230,235,.12);padding-top:14px;width:100%\">`+\n        `<div style=\"color:#9aa1ac;font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:10px\">Что получишь после оплаты</div>`+\n        `<div style=\"display:flex;flex-direction:column;gap:8px;text-align:left\">`+\n        `<div style=\"display:flex;gap:10px;color:#ccd1d8;font-size:13.5px;line-height:1.5\"><span style=\"flex:none;width:4px;height:4px;border-radius:50%;background:#e3e6ea;margin-top:8px\"></span><span>короткое вводное и церемонию на 1,5 часа, доступ сразу;</span></div>`+\n        `<div style=\"display:flex;gap:10px;color:#ccd1d8;font-size:13.5px;line-height:1.5\"><span style=\"flex:none;width:4px;height:4px;border-radius:50%;background:#e3e6ea;margin-top:8px\"></span><span>3 дара: урок «Свой алтарь», Отче наш с арамейского, вход в живое поле.</span></div>`+\n        `</div></div>`);\n    }\n\n    // таймер: мягкий «импульс сейчас», 15 минут, свой для каждого посетителя\n    const KEY=\"ceremony_impulse_timer\";\n    let end = localStorage.getItem(KEY);\n    if(!end){ end = Date.now()+15*60*1000; localStorage.setItem(KEY,end); }\n    end = parseInt(end,10);\n    const upd = ()=>{\n      const diff = end - Date.now();\n      const txt = diff<=0 ? \"00 : 00\" :\n        String(Math.floor(diff/60000)).padStart(2,\"0\")+\" : \"+String(Math.floor((diff%60000)/1000)).padStart(2,\"0\");\n      $$(\".timer\").forEach(t=>{ t.textContent = txt; });\n    };\n    upd();\n    this._timerInt = setInterval(upd,1000);\n\n    // отзывы-лента (набор продублирован для бесшовности)\n    const track = $(\"#marquee-track\");\n    if(track){\n      let imgs = [];\n      for(let i=1063;i<=1086;i++) imgs.push(`./reviews/img_${i}.jpg`);\n      imgs = imgs.concat(imgs);\n      track.innerHTML = imgs.map(src=>`<div style=\"flex:0 0 auto;width:230px\"><img src=\"${src}\" alt=\"отзыв\" loading=\"lazy\" style=\"width:100%;display:block;border:1px solid rgba(226,230,235,.12);border-radius:14px\"></div>`).join(\"\");\n    }\n\n    // модалка оплаты\n    const pay = $(\"#payModal\");\n    const openPay = ()=>{ pay.style.display=\"flex\"; document.body.style.overflow=\"hidden\"; };\n    const closePay = ()=>{ pay.style.display=\"none\"; document.body.style.overflow=\"\"; };\n    root.addEventListener(\"click\",(e)=>{ if(e.target.closest(\".cta-btn\")) openPay(); });\n    $(\"#payClose\").addEventListener(\"click\",closePay);\n    pay.addEventListener(\"click\",(e)=>{ if(e.target===pay) closePay(); });\n\n    // модалка legal\n    const legal = $(\"#legalModal\");\n    const openLegal = (which)=>{\n      $(\"#legal-privacy\").style.display = which===\"privacy\"?\"block\":\"none\";\n      $(\"#legal-offer\").style.display = which===\"offer\"?\"block\":\"none\";\n      legal.style.display=\"flex\"; document.body.style.overflow=\"hidden\";\n    };\n    const closeLegal = ()=>{ legal.style.display=\"none\"; document.body.style.overflow=\"\"; };\n    $(\"#link-privacy\").addEventListener(\"click\",(e)=>{ e.preventDefault(); openLegal(\"privacy\"); });\n    $(\"#link-offer\").addEventListener(\"click\",(e)=>{ e.preventDefault(); openLegal(\"offer\"); });\n    $(\"#legalClose\").addEventListener(\"click\",closeLegal);\n    legal.addEventListener(\"click\",(e)=>{ if(e.target===legal) closeLegal(); });\n    window.addEventListener(\"keydown\",(e)=>{ if(e.key===\"Escape\"){ closePay(); closeLegal(); } });\n\n    // форма: заявка → оплата WayForPay\n    const PAY_URL = \"https://secure.wayforpay.com/button/ba60ed52a88a5\";\n    const SHEET_WEBHOOK_URL = \"\"; // вставить ссылку Google Apps Script, когда будет\n    $(\"#buyForm\").addEventListener(\"submit\",(e)=>{\n      e.preventDefault();\n      const form = e.target;\n      const bot = form.querySelector(\"[name=bot-field]\");\n      if(bot && bot.value) return;\n      const data = new URLSearchParams(new FormData(form)).toString();\n      const go = ()=>{ window.location.href = PAY_URL; };\n      if(SHEET_WEBHOOK_URL){\n        fetch(SHEET_WEBHOOK_URL,{method:\"POST\",mode:\"no-cors\",headers:{\"Content-Type\":\"application/x-www-form-urlencoded\"},body:data}).then(go).catch(go);\n      } else { go(); }\n    });\n\n    // reveal on scroll\n    const io = new IntersectionObserver((es)=>es.forEach(en=>{\n      if(en.isIntersecting){ en.target.style.opacity=\"1\"; en.target.style.transform=\"none\"; io.unobserve(en.target); }\n    }),{threshold:0.1});\n    $$(\".reveal\").forEach(el=>{ el.style.opacity=\"0\"; el.style.transform=\"translateY(34px)\"; el.style.transition=\"opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1)\"; io.observe(el); });\n\n    // фоновое видео: форс-старт + шторка\n    const hideCover=()=>{ const c=$(\"#bg-cover\"); if(c) c.style.opacity=\"0\"; };\n    setTimeout(hideCover,5000);\n    const startBg=()=>{\n      try{\n        new window.YT.Player(\"bg-video\",{\n          events:{\n            onReady:(e)=>{ e.target.mute(); e.target.playVideo(); },\n            onStateChange:(e)=>{\n              if(e.data===window.YT.PlayerState.PLAYING){ setTimeout(hideCover,600); }\n              if(e.data===window.YT.PlayerState.ENDED){ e.target.seekTo(4); e.target.playVideo(); }\n            }\n          }\n        });\n      }catch(err){}\n    };\n    if(window.YT && window.YT.Player){ startBg(); }\n    else{\n      const prev=window.onYouTubeIframeAPIReady;\n      window.onYouTubeIframeAPIReady=()=>{ if(prev) prev(); startBg(); };\n      if(!document.querySelector(\"script[src*='youtube.com/iframe_api']\")){\n        const s=document.createElement(\"script\"); s.src=\"https://www.youtube.com/iframe_api\"; document.head.appendChild(s);\n      }\n    }\n    const nudge=()=>{ const f=$(\"#bg-video\"); if(f && f.contentWindow){ f.contentWindow.postMessage('{\"event\":\"command\",\"func\":\"playVideo\",\"args\":\"\"}','*'); } };\n    window.addEventListener(\"touchstart\",nudge,{once:true,passive:true});\n    window.addEventListener(\"click\",nudge,{once:true});\n\n    // звук\n    const sbtn=$(\"#sound-btn\");\n    const icoOff='<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 5 6 9H3v6h3l5 4z\"></path><line x1=\"16\" y1=\"9.5\" x2=\"20.5\" y2=\"14\"></line><line x1=\"20.5\" y1=\"9.5\" x2=\"16\" y2=\"14\"></line></svg>';\n    const icoOn='<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 5 6 9H3v6h3l5 4z\"></path><path d=\"M15.5 8.5a5 5 0 0 1 0 7\"></path><path d=\"M18.5 6a9 9 0 0 1 0 12\"></path></svg>';\n    const postBg=(func)=>{ const f=$(\"#bg-video\"); if(f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({event:\"command\",func:func,args:\"\"}),\"*\"); };\n    let soundOn=false;\n    if(sbtn){\n      sbtn.innerHTML=icoOff;\n      sbtn.addEventListener(\"click\",(e)=>{\n        e.stopPropagation();\n        soundOn=!soundOn;\n        if(soundOn){ postBg(\"unMute\"); postBg(\"playVideo\"); } else { postBg(\"mute\"); }\n        sbtn.innerHTML=soundOn?icoOn:icoOff;\n      });\n      const enableSound=()=>{ if(soundOn) return; soundOn=true; postBg(\"unMute\"); postBg(\"playVideo\"); sbtn.innerHTML=icoOn; };\n      [\"pointerdown\",\"touchstart\",\"keydown\",\"wheel\"].forEach(ev=>window.addEventListener(ev,enableSound,{once:true,passive:true}));\n      // Tisha panel\n      const tm=$(\"#tishaModal\");\n      if(tm){\n        $(\"#tisha-orb\").addEventListener(\"click\",()=>{ tm.style.display=\"flex\"; document.body.style.overflow=\"hidden\"; });\n        const closeTisha=()=>{ tm.style.display=\"none\"; document.body.style.overflow=\"\"; };\n        $(\"#tishaClose\").addEventListener(\"click\",closeTisha);\n        tm.addEventListener(\"click\",(e)=>{ if(e.target===tm) closeTisha(); });\n        window.addEventListener(\"keydown\",(e)=>{ if(e.key===\"Escape\") closeTisha(); });\n        $(\"#tishaCta\").addEventListener(\"click\",()=>{ closeTisha(); });\n      }\n    }\n  }\n\n  componentWillUnmount(){ if(this._timerInt) clearInterval(this._timerInt); }\n}\n<\/script>\n\n\n</body></html>"</script>
